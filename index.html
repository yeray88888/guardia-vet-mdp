<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b3fd6">
  <!-- A otros sitios solo se les manda el nombre del sitio, nunca la dirección completa
       (que puede tener el enlace de recuperación). OpenStreetMap necesita saber el sitio para dar el mapa. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Veterinarias de guardia y turnos en Mar del Plata">
  <title>Guardia Vet MDP</title>

  <!-- Estilos del mapa (Leaflet) y estilos propios -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css?v=2">
</head>
<body>
  <!-- React dibuja toda la aplicación dentro de este div -->
  <div id="root"></div>

  <noscript>Para usar Guardia Vet MDP tenés que activar JavaScript.</noscript>

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <!-- Babel traduce el JSX de app.js a JavaScript común dentro del navegador -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- La aplicación (React con JSX), dividida en archivos. El orden importa: app.js va último. -->
  <script type="text/babel" data-presets="react" src="js/datos.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/utilidades.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/api.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/demo.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/comunes.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/mapa.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/mascotas.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/buscar.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/dueno.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/veterinaria.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/componentes/ingreso.js?v=5"></script>
  <script type="text/babel" data-presets="react" src="js/app.js?v=5"></script>
</body>
</html>
